aid: zight
name: Zight
description: >-
  Zight (formerly CloudApp) is a visual communication and asynchronous
  collaboration platform for capturing and sharing screen recordings, screen
  captures, screenshots, GIFs, and webcam videos. Teams use Zight to record their
  screen, annotate images, generate instantly shareable links, and communicate
  asynchronously across support, sales, engineering, design, and customer-success
  workflows. The product spans desktop apps (macOS, Windows), browser extensions,
  mobile apps, and a web sharing surface at share.zight.com, with enterprise
  features including SSO/SAML, custom branding, analytics, and admin controls.
  Zight is backed by Bloomberg Beta. This API Evangelist profile tracks Zight's
  public developer, integration, security, and operational surface; the company
  currently exposes an integration/partner marketplace and a trust/security
  program rather than a documented public REST API.
